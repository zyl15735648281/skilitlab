# 生产部署用 compose：镜像由 CI 构建推送到 GHCR，服务器只负责 pull + 启动。
# 用法：docker compose -f docker-compose.prod.yml up -d
# 需在 .env 里设置 GITHUB_OWNER（你的 GitHub 用户名，小写）和 POSTGRES_PASSWORD。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilitlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skilitlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skilitlab} -d ${POSTGRES_DB:-skilitlab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GITHUB_OWNER}/skilitlab-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skilitlab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skilitlab}?schema=public
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  web:
    image: ghcr.io/${GITHUB_OWNER}/skilitlab-web:latest
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
